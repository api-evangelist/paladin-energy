name: Paladin Energy

description: Paladin Energy Limited is a global uranium producer listed on the ASX and TSX (PDN) and headquartered in Perth, Western Australia. It operates the Langer Heinrich Mine in Namibia, is developing
  the Patterson Lake South Project and Michelin Project in Canada (with early-stage exploration in the Athabasca Basin), and holds advanced exploration assets in Queensland and Western Australia, including
  Mt Isa and Manyingee. Its public website is investor and corporate information; no public developer API is published.

